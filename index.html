<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Bite - Moderator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden relative">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col z-20 shadow-xl hidden md:flex">
        <div class="p-6 border-b border-slate-800 bg-slate-950">
            <h1 class="text-xl font-bold text-emerald-400">Terra Bite</h1>
            <p class="text-xs text-slate-500 mt-1">POS & Management</p>
        </div>
        <div class="flex-1 overflow-y-auto scrollbar-hide p-4 space-y-1">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 mt-2">DASHBOARD</p>
            <button onclick="switchView('orders')" id="nav-orders" class="w-full flex items-center gap-3 px-4 py-2.5 bg-emerald-600/20 text-emerald-400 rounded-lg text-sm font-medium border border-emerald-500/20 transition-all text-left">
                <i class="fas fa-bell w-5 text-center"></i> ออเดอร์ (รายการ)
            </button>
            <button onclick="switchView('menu')" id="nav-menu" class="w-full flex items-center gap-3 px-4 py-2 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg text-sm transition-all mt-2 text-left">
                <i class="fas fa-utensils w-5 text-center"></i> จัดการเมนู & Option
            </button>
            <button onclick="switchView('coupons')" id="nav-coupons" class="w-full flex items-center gap-3 px-4 py-2 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg text-sm transition-all mt-2 text-left">
                <i class="fas fa-ticket-alt w-5 text-center"></i> จัดการโปรโมชั่น & คูปอง
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50">
        
        <!-- TOPBAR -->
        <header class="bg-white h-16 border-b border-slate-200 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
            <h2 class="text-lg font-bold text-slate-800">จัดการระบบร้านค้า 
                <span class="text-xs font-normal text-emerald-600 ml-2" id="db-status-order">
                    <i class="fas fa-circle-notch fa-spin"></i> เชื่อมต่อฐานข้อมูล...
                </span>
            </h2>
            
            <div class="flex items-center gap-3 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                <span class="text-xs font-bold text-slate-600">สถานะเดลิเวอรี่:</span>
                <button id="delivery-toggle-btn" onclick="toggleDeliveryStatus()" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm">
                    กำลังตรวจสอบ...
                </button>
            </div>
        </header>

        <!-- ========================================== -->
        <!-- 🟢 หน้าจัดการออเดอร์ -->
        <!-- ========================================== -->
        <div id="view-orders" class="flex flex-col flex-1 overflow-hidden w-full">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex gap-2 overflow-x-auto scrollbar-hide shrink-0">
                <button onclick="window.setOrderFilter('all')" id="btn-all" class="px-5 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium shadow-sm transition-colors">
                    ทั้งหมด (<span id="count-all">0</span>)
                </button>
                <button onclick="window.setOrderFilter('dine-in')" id="btn-dine" class="px-5 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <i class="fas fa-chair text-emerald-500"></i> หน้าร้าน (<span id="count-dine">0</span>)
                </button>
                <button onclick="window.setOrderFilter('delivery')" id="btn-del" class="px-5 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <i class="fas fa-motorcycle text-rose-500"></i> เดลิเวอรี่ (<span id="count-del">0</span>)
                </button>
            </div>

            <div class="flex-1 overflow-auto p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="order-container"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 🟢 หน้าจัดการเมนู -->
        <!-- ========================================== -->
        <div id="view-menu" class="hidden flex-col flex-1 overflow-hidden w-full">
            <div class="bg-white h-16 border-b border-slate-200 flex items-center justify-between px-6 shrink-0 shadow-sm">
                <h2 class="text-lg font-bold text-slate-800">จัดการคลังเมนูอาหาร</h2>
                <button onclick="openMenuPanel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2">
                    <i class="fas fa-plus"></i> สร้างเมนูใหม่
                </button>
            </div>
            <!-- ตัวกรองหมวดหมู่เมนู -->
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex gap-2 overflow-x-auto scrollbar-hide shrink-0" id="menu-category-filters">
                <!-- หมวดหมู่จะถูกโหลดที่นี่อัตโนมัติ -->
            </div>
            <div class="flex-1 overflow-auto p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="menu-list-container"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 🟢 หน้าจัดการโปรโมชั่น & คูปอง -->
        <!-- ========================================== -->
        <div id="view-coupons" class="hidden flex-col flex-1 overflow-hidden w-full">
            <div class="bg-white h-16 border-b border-slate-200 flex items-center justify-between px-6 shrink-0 shadow-sm">
                <h2 class="text-lg font-bold text-slate-800">คูปองส่วนลด & โปรโมชั่น</h2>
                <button onclick="openCouponPanel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2">
                    <i class="fas fa-plus"></i> สร้างคูปองใหม่
                </button>
            </div>
            <div class="flex-1 overflow-auto p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="coupon-list-container"></div>
            </div>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- 🟢 Modal: ดูออเดอร์แบบเต็มจอ (Fullscreen) -->
    <!-- ========================================== -->
    <div id="order-fullscreen-modal" class="fixed inset-0 bg-slate-900 text-white z-[100] hidden flex-col pb-8">
        <div class="flex justify-between items-center p-6 border-b border-slate-700 bg-slate-800">
            <h2 class="text-2xl font-bold flex items-center gap-3"><i class="fas fa-receipt text-emerald-400"></i> รายละเอียดออเดอร์</h2>
            <button onclick="closeOrderFullscreen()" class="text-slate-400 hover:text-white text-3xl">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto p-8" id="order-fullscreen-content">
            <!-- เนื้อหาเต็มจอจะถูกแทรกที่นี่ -->
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 🟢 สไลด์พาเนล: สร้าง/แก้ไขเมนู -->
    <!-- ========================================== -->
    <div id="menu-panel-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden"></div>
    <div id="menu-panel" class="fixed top-0 right-0 h-full w-full max-w-2xl bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="text-xl font-bold text-slate-800" id="modal-title-menu"><i class="fas fa-utensils text-emerald-600 mr-2"></i>สร้างเมนูอาหาร</h3>
            <button onclick="closeMenuPanel()" class="text-slate-500 hover:text-rose-500"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <input type="hidden" id="menu-id">
            
            <section class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <label class="block text-slate-600 text-sm font-bold mb-2">รูปภาพเมนู</label>
                <input type="file" id="menu-img-upload" accept="image/*" onchange="uploadImage(this)" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                <p id="upload-status" class="text-xs text-slate-500 mt-2">รองรับ JPG, PNG (ขนาดไม่เกิน 2MB)</p>
                <input type="hidden" id="menu-img-url">
                <img id="img-preview" class="mt-3 h-32 rounded-lg object-cover hidden shadow-sm border border-slate-200">
            </section>

            <section class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-slate-600 text-sm font-bold mb-1">ชื่อเมนู <span class="text-rose-500">*</span></label>
                    <input type="text" id="menu-name" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                </div>
                <div class="col-span-1">
                    <label class="block text-slate-600 text-sm font-bold mb-1">ราคา (บาท) <span class="text-rose-500">*</span></label>
                    <input type="number" id="menu-price" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                </div>
                <div class="col-span-1">
                    <label class="block text-slate-600 text-sm font-bold mb-1">หมวดหมู่</label>
                    <input type="text" id="menu-category" placeholder="เช่น อาหารจานเดียว, เครื่องดื่ม" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                </div>
                <div class="col-span-2">
                    <label class="block text-slate-600 text-sm font-bold mb-1">จำนวนคลังสินค้า (สต็อก)</label>
                    <input type="number" id="menu-stock" placeholder="เว้นว่างไว้หากไม่จำกัดจำนวน" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                </div>
            </section>

            <section class="border-t border-slate-200 pt-6">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-sm font-bold text-slate-800">ตัวเลือกเสริม (Options / ท็อปปิ้ง)</h4>
                    <button onclick="addOptionGroup()" class="text-xs text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg font-bold border border-emerald-100 hover:bg-emerald-100">
                        + เพิ่มกลุ่มตัวเลือก
                    </button>
                </div>
                <div id="options-builder-container" class="space-y-4"></div>
            </section>
        </div>

        <div class="p-6 border-t border-slate-200 bg-white flex justify-end gap-3">
            <button onclick="saveMenuToFirebase()" id="btn-save-menu" class="px-6 py-3 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md w-full sm:w-auto">
                บันทึกข้อมูลเข้าระบบ
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 🟢 สไลด์พาเนล: สร้าง/แก้ไขคูปองโปรโมชั่น -->
    <!-- ========================================== -->
    <div id="coupon-panel-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden"></div>
    <div id="coupon-panel" class="fixed top-0 right-0 h-full w-full max-w-lg bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="text-xl font-bold text-slate-800" id="modal-title-coupon"><i class="fas fa-ticket-alt text-emerald-600 mr-2"></i>สร้างคูปองส่วนลด</h3>
            <button onclick="closeCouponPanel()" class="text-slate-500 hover:text-rose-500"><i class="fas fa-times text-xl"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-4">
            <input type="hidden" id="coupon-id">
            <div>
                <label class="block text-slate-600 text-sm font-bold mb-1">รหัสคูปอง/ชื่อโปรโมชั่น <span class="text-rose-500">*</span></label>
                <input type="text" id="coupon-code" placeholder="เช่น DISCOUNT20" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500 uppercase">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-600 text-sm font-bold mb-1">ประเภทส่วนลด <span class="text-rose-500">*</span></label>
                    <select id="coupon-type" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                        <option value="amount">ลดเป็นเงินบาท (฿)</option>
                        <option value="percent">ลดเป็นเปอร์เซ็นต์ (%)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-600 text-sm font-bold mb-1">มูลค่าส่วนลด <span class="text-rose-500">*</span></label>
                    <input type="number" id="coupon-value" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- การตั้งค่าเพิ่มเติม -->
            <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="col-span-2">
                    <label class="block text-slate-600 text-sm font-bold mb-1">การแสดงผลให้ลูกค้าเห็น</label>
                    <select id="coupon-visibility" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                        <option value="show">แสดงโชว์ในหน้าร้าน (กดรับได้เลย)</option>
                        <option value="hide">ซ่อนไว้ (ลูกค้าต้องพิมพ์รหัสเอง)</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-slate-600 text-sm font-bold mb-1">โควต้า / จำนวนสิทธิ์ (0 = ไม่จำกัด)</label>
                    <input type="number" id="coupon-limit" value="0" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-slate-600 text-sm font-bold mb-1">วันเริ่มโปรโมชั่น (ไม่บังคับ)</label>
                    <input type="datetime-local" id="coupon-start" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-slate-600 text-sm font-bold mb-1">วันสิ้นสุด (ไม่บังคับ)</label>
                    <input type="datetime-local" id="coupon-end" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-emerald-500 text-sm">
                </div>
            </div>
            
            <div class="border-t border-slate-200 pt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-slate-600 text-sm font-bold">เลือกเมนูที่สามารถใช้คูปองนี้ได้</label>
                    <button onclick="toggleAllCoupons(true)" class="text-xs text-emerald-600 hover:underline">เลือกทั้งหมด</button>
                </div>
                <div id="coupon-applicable-items" class="space-y-2 max-h-64 overflow-y-auto p-2 border border-slate-100 rounded-lg bg-slate-50">
                    <!-- Checkboxes ของเมนูจะแสดงที่นี่ -->
                </div>
            </div>
        </div>

        <div class="p-6 border-t border-slate-200 bg-white flex justify-end gap-3">
            <button onclick="saveCouponToFirebase()" id="btn-save-coupon" class="px-6 py-3 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md w-full">
                บันทึกโปรโมชั่น
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPT (Admin Dashboard) -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const firebaseConfig = {
            apiKey: "AIzaSyAsgcKhn0V1lYjF754aypxZv5C-PmHCvno",
            authDomain: "mobile-first-5543c.firebaseapp.com",
            projectId: "mobile-first-5543c",
            storageBucket: "mobile-first-5543c.firebasestorage.app",
            messagingSenderId: "375984636440",
            appId: "1:375984636440:web:685692699c3320e201f96d"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const supabaseUrl = 'https://vupihvoldblwdtkfnjjc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1cGlodm9sZGJsd2R0a2ZuampjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTAwNDAsImV4cCI6MjEwNjk2NjA0MH0.Db91stvkIKdpWOz_nn185obEkcJX4V12HOZlkgiBO3s';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let isDeliveryOpen = true;
        let adminMenus = []; // เก็บเมนูทั้งหมดเพื่อใช้อ้างอิง
        let adminCoupons = []; // เก็บข้อมูลคูปอง
        let currentMenuCategory = 'all';
        let activeOrders = []; 
        let currentOrderFilter = 'all';

        // จัดการเปิด/ปิดสถานะเดลิเวอรี่
        window.toggleDeliveryStatus = async () => {
            isDeliveryOpen = !isDeliveryOpen;
            try {
                await setDoc(doc(db, "settings", "shop"), { deliveryOpen: isDeliveryOpen }, { merge: true });
                updateDeliveryButtonUI(isDeliveryOpen);
            } catch (e) {
                console.error("Error updating status:", e);
                alert("ไม่สามารถเปลี่ยนสถานะได้");
            }
        };

        function updateDeliveryButtonUI(isOpen) {
            const btn = document.getElementById('delivery-toggle-btn');
            if (isOpen) {
                btn.className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-white shadow-sm hover:bg-emerald-600";
                btn.innerHTML = '<i class="fas fa-check-circle"></i> เปิดรับเดลิเวอรี่';
            } else {
                btn.className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-rose-500 text-white shadow-sm hover:bg-rose-600";
                btn.innerHTML = '<i class="fas fa-ban"></i> ปิดรับเดลิเวอรี่';
            }
        }

        async function loadShopStatus() {
            const docRef = doc(db, "settings", "shop");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                isDeliveryOpen = docSnap.data().deliveryOpen ?? true;
            } else {
                await setDoc(docRef, { deliveryOpen: true });
                isDeliveryOpen = true;
            }
            updateDeliveryButtonUI(isDeliveryOpen);
        }
        loadShopStatus();

        window.uploadImage = async (input) => {
            const file = input.files[0];
            if(!file) return;
            const status = document.getElementById('upload-status');
            status.innerHTML = '<i class="fas fa-spinner fa-spin text-emerald-600"></i> กำลังอัปโหลดภาพ...';
            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `menu_${Date.now()}.${fileExt}`;
                const { data, error } = await supabase.storage.from('restaurant-assets').upload(fileName, file);
                if (error) throw error;
                const { data: publicUrlData } = supabase.storage.from('restaurant-assets').getPublicUrl(fileName);
                const imageUrl = publicUrlData.publicUrl;
                document.getElementById('menu-img-url').value = imageUrl;
                document.getElementById('img-preview').src = imageUrl;
                document.getElementById('img-preview').classList.remove('hidden');
                status.innerHTML = '<i class="fas fa-check-circle text-emerald-600"></i> อัปโหลดสำเร็จ!';
            } catch (error) {
                status.innerHTML = '<i class="fas fa-times-circle text-rose-500"></i> อัปโหลดล้มเหลว';
            }
        };

        window.switchView = (view) => {
            ['orders', 'menu', 'coupons'].forEach(v => {
                const viewEl = document.getElementById(`view-${v}`);
                const navEl = document.getElementById(`nav-${v}`);
                if(viewEl) {
                    viewEl.classList.add('hidden');
                    viewEl.classList.remove('flex');
                }
                if(navEl) {
                    navEl.className = "w-full flex items-center gap-3 px-4 py-2 hover:bg-slate-800 text-slate-400 rounded-lg text-sm transition-all mt-2 text-left";
                }
            });

            const activeView = document.getElementById(`view-${view}`);
            const activeNav = document.getElementById(`nav-${view}`);
            
            if(activeView) {
                activeView.classList.remove('hidden');
                activeView.classList.add('flex');
            }
            if(activeNav) {

            const selectedItems = Array.from(document.querySelectorAll('.coupon-item-cb:checked')).map(cb => cb.value);

            if(!code || isNaN(value) || value <= 0) return alert('กรุณากรอกรหัส/ชื่อโปรโมชั่น และมูลค่าส่วนลดให้ถูกต้อง');
            if(selectedItems.length === 0) return alert('กรุณาเลือกเมนูที่สามารถใช้คูปองนี้ได้อย่างน้อย 1 รายการ');

            const btn = document.getElementById('btn-save-coupon');
            btn.innerHTML = 'กำลังบันทึก...';
            btn.disabled = true;

            const couponData = {
                code, type, value, applicable_items: selectedItems,
                visibility, usageLimit, startDate, endDate,
                updated_at: new Date(), active: true
            };

            if (id) {
                await updateDoc(doc(db, "coupons", id), couponData);
            } else {
                couponData.usedCount = 0; // ตั้งค่าเริ่มต้นโควต้าการใช้งาน
                couponData.created_at = new Date();
                await addDoc(collection(db, "coupons"), couponData);
            }

            btn.innerHTML = 'บันทึกโปรโมชั่น';
            btn.disabled = false;
            window.closeCouponPanel();
        };

        const qCoupon = query(collection(db, "coupons"), orderBy("created_at", "desc"));
        onSnapshot(qCoupon, (snapshot) => {
            adminCoupons = [];
            const container = document.getElementById('coupon-list-container');
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">ยังไม่มีคูปอง/โปรโมชั่น</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const c = { id: docSnap.id, ...docSnap.data() };
                adminCoupons.push(c);
                const typeText = c.type === 'percent' ? '%' : 'บาท';
                const limitText = c.usageLimit > 0 ? `${c.usedCount || 0}/${c.usageLimit} ครั้ง` : 'ไม่จำกัด';
                const viewText = c.visibility === 'show' ? '<i class="fas fa-eye text-emerald-500"></i> แสดงผลหน้าร้าน' : '<i class="fas fa-eye-slash text-slate-400"></i> ซ่อน (พิมพ์รหัสเอง)';

                container.innerHTML += `
                    <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col relative overflow-hidden">
                        <div class="absolute top-0 right-0 bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded-bl-lg">Active</div>
                        <div class="flex justify-between items-start mb-2 pr-10">
                            <h3 class="font-bold text-lg text-emerald-600"><i class="fas fa-ticket-alt"></i> ${c.code}</h3>
                        </div>
                        <p class="text-sm text-slate-600 mb-1">ส่วนลด: <span class="font-bold text-rose-500 text-lg">${c.value} ${typeText}</span></p>
                        <p class="text-xs text-slate-500 mb-1">${viewText}</p>
                        <p class="text-xs text-slate-500 mb-3"><i class="fas fa-chart-pie"></i> การใช้งาน: ${limitText}</p>
                        <div class="mt-auto pt-3 flex justify-between items-center border-t border-slate-100">
                            <span class="text-[10px] text-slate-500 bg-slate-50 p-1.5 rounded border border-slate-100">ใช้ได้กับ: ${c.applicable_items.length} เมนู</span>
                            <div class="flex gap-2">
                                <button onclick="openCouponPanel('${c.id}')" class="text-xs text-amber-500 hover:underline"><i class="fas fa-edit"></i> แก้ไข</button>
                                <button onclick="deleteCoupon('${c.id}')" class="text-xs text-rose-500 hover:underline"><i class="fas fa-trash-alt"></i> ลบ</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        window.deleteCoupon = async (id) => { if(confirm('ต้องการลบคูปอง/โปรโมชั่นนี้ใช่หรือไม่?')) await deleteDoc(doc(db, "coupons", id)); };

    </script>
</body>
</html>
